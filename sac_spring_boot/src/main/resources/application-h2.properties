# Default DataSource config fallback
spring.datasource.url=jdbc:h2:mem:sac_core;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=KEY,VALUE,VALUES,ROLES,ROLE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

