# H2 Database configuration for local running without MySQL
spring.datasource.url=jdbc:h2:mem:sac_erp;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=KEY,VALUE,VALUES,ROLES,ROLE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Disable Flyway for H2 to avoid syntax incompatibility with MySQL migration scripts
spring.flyway.enabled=false
