# ==========================================================================
# SAC ERP - Application Configuration
# School Academy College - Enterprise Resource Planning System
# ==========================================================================

# Server Configuration
server.port=8085
server.servlet.context-path=/

# ==========================================================================
# Database Configuration (MySQL 8)
# ==========================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/sac_core?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL Core Database
spring.datasource.core.url=jdbc:mysql://localhost:3306/sac_core?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.core.username=root
spring.datasource.core.password=
spring.datasource.core.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL Canteen Database
spring.datasource.canteen.url=jdbc:mysql://localhost:3306/sac_canteen?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.canteen.username=root
spring.datasource.canteen.password=
spring.datasource.canteen.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL Academic Database
spring.datasource.academic.url=jdbc:mysql://localhost:3306/sac_academic?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.academic.username=root
spring.datasource.academic.password=
spring.datasource.academic.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL Student Database
spring.datasource.student.url=jdbc:mysql://localhost:3306/sac_student?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.student.username=root
spring.datasource.student.password=
spring.datasource.student.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL Fees Database
spring.datasource.fees.url=jdbc:mysql://localhost:3306/sac_fees?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.fees.username=root
spring.datasource.fees.password=
spring.datasource.fees.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL HR Database
spring.datasource.hr.url=jdbc:mysql://localhost:3306/sac_hr?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.hr.username=root
spring.datasource.hr.password=
spring.datasource.hr.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================================================
# JPA / Hibernate Configuration
# ==========================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.sac.erp.tenant.TenantIdentifierResolver
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ==========================================================================
# Flyway Migration Configuration (Disabled for multi-datasource routing)
# ==========================================================================
spring.flyway.enabled=false

# ==========================================================================
# JWT Configuration
# ==========================================================================
app.jwt.secret=sac_developed_by_tis_java_spring_boot_migration_secret_key_jwt_2026_enterprise_grade
app.jwt.expiration-ms=86400000

# ==========================================================================
# Spring Security
# ==========================================================================
spring.security.filter.order=10

# ==========================================================================
# OpenAPI / Swagger Configuration
# ==========================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ==========================================================================
# Actuator Configuration
# ==========================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ==========================================================================
# Logging Configuration
# ==========================================================================
logging.level.com.sac=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==========================================================================
# Cache Configuration
# ==========================================================================
spring.cache.type=simple

# ==========================================================================
# Email Configuration (configure before deployment)
# ==========================================================================
# spring.mail.host=smtp.gmail.com
# spring.mail.port=587
# spring.mail.username=your-email@domain.com
# spring.mail.password=your-app-password
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

# Jackson Configuration
spring.jackson.serialization.fail-on-empty-beans=false
